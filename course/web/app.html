<style>
/* Layout: a study desk — top bar, one reading column for lessons (~68ch),
   a two-column dashboard on wide screens, everything single-column on phones.
   Charts sit on faint graph paper, the subject's native surface. */
:root {
  --paper: #f3f6f7;
  --card: #ffffff;
  --ink: #15222a;
  --muted: #586a74;
  --line: #d6dfe3;
  --grid: #e6edf0;
  --accent: #0d6b72;
  --accent-soft: #dcefef;
  --supply: #b8611a;
  --supply-soft: #f6e5d6;
  --good: #2c7a47;
  --good-soft: #e1f1e6;
  --bad: #b13838;
  --bad-soft: #f7e1e1;
  --warn: #9a6400;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui: Inter, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e161b; --card: #152029; --ink: #e2eaed; --muted: #97a9b2; --line: #283842; --grid: #1c2a33;
  --accent: #4db1b7; --accent-soft: #163a3d; --supply: #e39a57; --supply-soft: #3b2a1b;
  --good: #63c48a; --good-soft: #17301f; --bad: #e87474; --bad-soft: #3a1c1c; --warn: #e0b04f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e161b; --card: #152029; --ink: #e2eaed; --muted: #97a9b2; --line: #283842; --grid: #1c2a33;
  --accent: #4db1b7; --accent-soft: #163a3d; --supply: #e39a57; --supply-soft: #3b2a1b;
  --good: #63c48a; --good-soft: #17301f; --bad: #e87474; --bad-soft: #3a1c1c; --warn: #e0b04f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card) }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 10px }
.brand { font: 700 19px/1 var(--f-display); letter-spacing: -0.01em; text-decoration: none; color: var(--ink); display: flex; align-items: baseline; gap: 8px }
.brand small { font: 500 11px var(--f-ui); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; margin-left: auto }
nav.main a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 500; font-size: 14px }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 60px }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px }
.read { max-width: 720px; margin: 0 auto; width: 100% }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.01em; margin: 0 }
h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15 }
h2 { font-size: 21px }
h3 { font-size: 16px }
.eyebrow { font: 600 11.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0 }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card) }
.btn.big { padding: 14px 18px; font-size: 16px; width: 100%; justify-content: center }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.chip { display: inline-block; font: 600 11.5px var(--f-ui); padding: 2px 8px; border-radius: 99px; background: var(--grid); color: var(--muted); white-space: nowrap }
.chip.ok { background: var(--good-soft); color: var(--good) }
.chip.open { background: var(--accent-soft); color: var(--accent) }
.bar { height: 8px; background: var(--grid); border-radius: 99px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono) }

/* dashboard */
.hero { display: grid; gap: 14px }
.hero .stat { font: 700 44px/1 var(--f-display); font-variant-numeric: tabular-nums }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px }
.unit { display: grid; gap: 8px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px }
.unit.locked { opacity: .55 }
.unit .t { font-weight: 600 }
.track-Reasoning { --tc: var(--accent) }
.track-Statistics { --tc: var(--supply) }
.track-Accounting-finance { --tc: var(--good) }
.track-Mixed { --tc: var(--muted) }
.unit .tr { font: 600 11px var(--f-ui); color: var(--tc); letter-spacing: .06em; text-transform: uppercase }
.lessons { list-style: none; margin: 0; padding: 0; display: grid }
.lessons li a, .lessons li span { display: flex; gap: 12px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink) }
.lessons li span { color: var(--muted) }
.lessons .id { font: 500 13px var(--f-mono); color: var(--muted); min-width: 52px }

/* lesson text */
.prose { font: 17px/1.65 var(--f-read); min-width: 0 }
.prose h2 { font-size: 21px; margin: 28px 0 8px }
.prose h3 { margin: 22px 0 6px }
.prose p, .prose ul, .prose ol { margin: 0 0 14px }
.prose li { margin: 4px 0 }
.prose pre { font: 14.5px/1.55 var(--f-mono); background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 16px }
.prose code { font: 0.86em var(--f-mono); background: var(--grid); padding: 1px 5px; border-radius: 4px }
.prose pre code { background: none; padding: 0; font-size: inherit }
.prose blockquote { margin: 0 0 16px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--supply); border-radius: 6px }
.prose blockquote p:last-child { margin: 0 }
.tablebox { overflow-x: auto; margin: 0 0 16px }
.prose table { border-collapse: collapse; font: 14px/1.4 var(--f-ui); min-width: 100% }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; font-variant-numeric: tabular-nums }
.prose th { font-weight: 600; background: var(--grid) }

/* widgets */
.widget { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; margin: 8px 0 22px }
.widget h3 { display: flex; gap: 8px; align-items: center }
.ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px }
.ctrl { display: grid; gap: 2px; font-size: 13px; min-width: 0 }
.ctrl label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted) }
.ctrl output { font: 500 13px var(--f-mono); color: var(--ink) }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent) }
.plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
svg.plot { width: 100%; height: auto; display: block; background: var(--card) }
svg.plot .gridl { stroke: var(--grid); stroke-width: 1 }
svg.plot .axis { stroke: var(--muted); stroke-width: 1.2 }
svg.plot text { fill: var(--muted); font: 11px var(--f-ui) }
svg.plot text.lab { fill: var(--ink); font-weight: 600 }
svg.plot .d { stroke: var(--accent); stroke-width: 2.4; fill: none }
svg.plot .s { stroke: var(--supply); stroke-width: 2.4; fill: none }
svg.plot .g { stroke: var(--good); stroke-width: 2.2; fill: none }
svg.plot .k { stroke: var(--ink); stroke-width: 1.6; fill: none }
svg.plot .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none }
svg.plot .fd { fill: var(--accent); opacity: .18 }
svg.plot .fs { fill: var(--supply); opacity: .22 }
svg.plot .fg { fill: var(--good); opacity: .22 }
svg.plot .fb { fill: var(--bad); opacity: .25 }
svg.plot .fk { fill: var(--muted); opacity: .25 }
svg.plot .dot { fill: var(--ink); stroke: var(--card); stroke-width: 2 }
svg.plot .bard { fill: var(--accent); opacity: .75 }
svg.plot .bars { fill: var(--supply); opacity: .8 }
.readout { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px }
.readout b { font: 500 13.5px var(--f-mono) }
.wcap { font-size: 13.5px; color: var(--muted) }

/* question runner */
.qbox { display: grid; gap: 14px }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap }
.qtext { font: 17px/1.55 var(--f-read); white-space: pre-line }
.opts { display: grid; gap: 8px }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; display: flex; gap: 10px; align-items: baseline; min-height: 48px }
.opt:hover:not([disabled]) { border-color: var(--accent) }
.opt .k { font: 600 13px var(--f-mono); color: var(--muted) }
.opt.right { border-color: var(--good); background: var(--good-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.ans { display: flex; gap: 8px; flex-wrap: wrap }
.ans input { flex: 1 1 160px; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font: 16px var(--f-mono) }
.fb { border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14.5px }
.fb.good { background: var(--good-soft) }
.fb.badf { background: var(--bad-soft) }
.fb.hint { background: var(--accent-soft) }
.sol { font: 14.5px/1.5 var(--f-mono); white-space: pre-wrap }
.result { text-align: center; display: grid; gap: 8px; padding: 10px }
.result .big { font: 700 40px var(--f-display) }
.timer { font: 600 14px var(--f-mono) }
.lock { display: grid; gap: 10px; justify-items: start }
textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font: 12.5px var(--f-mono) }
.search { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card) }
.gl { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20 }
@media (max-width: 640px) {
  nav.main { margin-left: 0; width: 100% }
  nav.main a { padding: 6px 8px; font-size: 13.5px }
  .prose { font-size: 16.5px }
  .hero .stat { font-size: 36px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ======================================================================
   data + state
   ====================================================================== */
const S = { D: null, st: null, order: [], lessonIx: {}, unitIx: {}, session: null };
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
function blankState() {
  return { read: {}, stats: {}, cards: {}, exams: [], fund: { passed: {}, finals: [], final_passed: false }, updated: 0 };
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- storage: claude db (synced) or this browser ---------- */
const Store = {
  mode: "local", ref: null, writing: false, dirty: false, timer: null,
  readLocal() { try { return JSON.parse(localStorage.getItem("mn-progress") || "null"); } catch { return null; } },
  writeLocal(s) { try { localStorage.setItem("mn-progress", JSON.stringify(s)); } catch {} },
  async init() {
    let remote = null;
    const local = this.readLocal();
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const timeout = (p) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), 10000))]);
        const [db, user] = await timeout(Promise.all([window.claude.use("db"), window.claude.use("user")])) || [];
        const uid = user ? await user.id() : null;
        if (db && uid) {
          this.ref = db.doc("data/users/" + uid + "/progress");
          const snap = await timeout(this.ref.get());
          if (snap) { this.mode = "cloud"; if (snap.exists) remote = JSON.parse(snap.data().json || "null"); }
        }
      }
    } catch (e) { this.mode = "local"; }
    S.st = mergeStates(local, remote) || blankState();
    this.writeLocal(S.st);
    this.label();
  },
  label() {
    $("#sync").textContent = this.mode === "cloud" ? "● synced to your account" : "● saved in this browser";
    $("#sync").title = this.mode === "cloud" ? "Progress syncs between your devices" : "Open the published page to sync across devices";
  },
  save() {
    S.st.updated = Date.now();
    this.writeLocal(S.st);
    if (this.mode !== "cloud") return;
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1200);
  },
  async flush() {
    if (!this.dirty || this.writing || !this.ref) return;
    this.writing = true; this.dirty = false;
    try { await this.ref.set({ json: JSON.stringify(S.st), updated: S.st.updated }); $("#sync").textContent = "● synced to your account"; }
    catch (e) { $("#sync").textContent = "● sync paused — saved in this browser"; }
    this.writing = false;
    if (this.dirty) this.timer = setTimeout(() => this.flush(), 1200);
  },
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") Store.flush(); });

function mergeStates(a, b) {
  if (!a) return b; if (!b) return a;
  const [base, other] = (a.updated || 0) >= (b.updated || 0) ? [a, b] : [b, a];
  const m = JSON.parse(JSON.stringify(base));
  m.fund = m.fund || { passed: {}, finals: [], final_passed: false };
  const of = other.fund || {};
  for (const [k, v] of Object.entries(of.passed || {})) if (!m.fund.passed[k]) m.fund.passed[k] = v;
  m.fund.final_passed = !!(m.fund.final_passed || of.final_passed);
  const seen = new Set((m.fund.finals || []).map((e) => e.date + e.right + e.total));
  for (const e of of.finals || []) if (!seen.has(e.date + e.right + e.total)) m.fund.finals.push(e);
  for (const [k, v] of Object.entries(other.read || {})) if (!m.read[k]) m.read[k] = v;
  for (const [k, v] of Object.entries(other.cards || {})) if (!m.cards[k]) m.cards[k] = v;
  for (const [k, v] of Object.entries(other.stats || {})) if (!m.stats[k]) m.stats[k] = v;
  return m;
}

/* ---------- lookups ---------- */
function indexData() {
  for (const u of S.D.fund) for (const l of u.lessons) { S.order.push(l.id); S.lessonIx[l.id] = { ...l, unit: u }; }
  for (const u of S.D.fund) S.unitIx[u.id] = u;
  S.gLessonIx = {}; for (const m of S.D.general) for (const l of m.lessons) S.gLessonIx[l.id] = { ...l, module: m };
  S.mcqById = {}; for (const q of S.D.questions) S.mcqById[q.id] = q;
  S.fexById = {}; for (const l of Object.values(S.lessonIx)) for (const x of l.ex) S.fexById[x.id] = x;
  S.bankByTopic = {};
  for (const sec of ["fund", "general"]) for (const g of S.D.bank[sec]) { if (!S.bankByTopic[g.topic]) S.bankByTopic[g.topic] = { ...g, sec }; }
}
const fs = () => S.st.fund;
const generalUnlocked = () => !!fs().final_passed;
const isPassed = (id) => !!fs().passed[id];
const isUnlocked = (id) => { const i = S.order.indexOf(id); return i === 0 || (i > 0 && isPassed(S.order[i - 1])); };
const nextLesson = () => S.order.find((id) => !isPassed(id));
const doneCount = () => S.order.filter(isPassed).length;
const hid = (id) => id.replace(/\./g, "-");
const unhid = (s) => s.replace(/-/g, ".");

/* ---------- exercise normalisation ---------- */
function itemFromFex(x, lessonId) {
  if (x.kind === "mcq") return { type: "mcq", id: x.id, lesson: lessonId, q: x.q, options: x.options, correct: x.correct, traps: x.traps || {}, why: x.sol };
  return { type: "num", id: x.id, lesson: lessonId, prompt: x.q, answer: x.answer, rel: x.rel, abs: x.abs, pct: x.pct, hint: x.hint || "Re-read the lesson's worked example.", sol: x.sol, traps: x.traps || [] };
}
function itemFromMcq(q) { return { type: "mcq", id: q.id, lesson: q.lesson, q: q.q, options: q.options, correct: q.answer, traps: q.traps || {}, why: q.why }; }
function itemFromBank(g, rnd = Math.random) {
  const e = g.items[Math.floor(rnd() * g.items.length)];
  return { type: "num", id: "gen:" + g.topic, lesson: g.lesson, topic: g.topic, prompt: e.prompt, answer: e.answer, rel: e.rel, abs: e.abs, pct: e.pct, hint: e.hint, sol: e.sol, traps: e.traps };
}

/* ---------- answer checking (mirrors generators.Exercise.matches) ---------- */
const isclose = (a, b, rel, abs) => Math.abs(a - b) <= Math.max(rel * Math.max(Math.abs(a), Math.abs(b)), abs);
function matches(it, v, target = it.answer) {
  if (isclose(v, target, it.rel, it.abs)) return true;
  if (it.pct) for (const s of [v / 100, v * 100]) if (isclose(s, target, it.rel, 1e-9)) return true;
  return false;
}
function parseNum(t) {
  let c = String(t).replace(/[,€$\s]/g, "").replace(/−/g, "-");
  const pct = c.endsWith("%"); c = c.replace(/%$/, "");
  let v;
  if (c.includes("/")) { const [a, b] = c.split("/"); v = parseFloat(a) / parseFloat(b); } else v = Number(c);
  if (c === "" || !isFinite(v)) return null;
  return pct ? v / 100 : v;
}
const fmt = (v, d = 4) => { const r = Number(v.toFixed(d)); return r.toLocaleString("en-US", { maximumFractionDigits: d }); };

/* ---------- spaced repetition ---------- */
function record(lessonId, cardId, ok) {
  const st = S.st.stats[lessonId] || (S.st.stats[lessonId] = { right: 0, wrong: 0 });
  st[ok ? "right" : "wrong"]++;
  const c = S.st.cards[cardId] || { box: 1, due: today() };
  c.box = ok ? Math.min(5, c.box + 1) : 1;
  c.due = addDays(S.D.config.leitnerDays[c.box]);
  c.lesson = lessonId;
  S.st.cards[cardId] = c;
  Store.save();
}

/* ======================================================================
   question runner
   ====================================================================== */
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function runSession(host, items, opt) {
  const o = Object.assign({ attempts: 2, hints: true, title: "Questions", record: true }, opt);
  let i = 0, right = 0;
  const box = h("div", { class: "panel qbox" });
  host.replaceChildren(box);
  const timerEl = o.deadline ? h("span", { class: "timer" }) : null;
  let tick = null;

function mountWidget(id) {
  const W = WIDGETS[id]; if (!W) return null;

    ctrls.append(h("div", { class: "ctrl" }, h("label", { for: `w-${id}-${key}` }, h("span", { text: label }), o), inp));

  W.draw(v, plots, out);

}

/* Markdown subset used by the lesson files: headings, paragraphs, lists,
   fenced code, tables, blockquotes, **bold**, *italic*, `code`, [links](url). */
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(t) {
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\\([*_#\[\]()])/g, "$1");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function mdHtml(src) {
  const L = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isBlockStart = (l) => /^(#{1,4} |```|> ?|\|)/.test(l) || /^\s*([-*]|\d+\.) /.test(l);
  while (i < L.length) {

  const right = Object.values(S.st.stats).reduce((a, s) => a + s.right, 0), wrong = Object.values(S.st.stats).reduce((a, s) => a + s.wrong, 0);
  const boxes = [1, 2, 3, 4, 5].map((b) => Object.values(S.st.cards).filter((c) => c.box === b).length);
  const weak = Object.entries(S.st.stats).filter(([, s]) => s.right + s.wrong >= 3).map(([id, s]) => [id, s.right / (s.right + s.wrong)]).sort((a, b) => a[1] - b[1]).slice(0, 6);
  const ta = h("textarea", { id: "import-json", placeholder: "Paste the contents of course/.progress.json from the terminal trainer here" });
  view(h("section", { class: "grid2" },
    h("div", { class: "panel", style: "display:grid;gap:8px" }, h("h2", { text: "Progress" }),
      h("div", {}, `Fundamentals: `, h("b", { class: "num", text: `${doneCount()}/${S.order.length}` }), " lessons passed"),
      h("div", {}, `Answers: `, h("b", { class: "num", text: `${right + wrong}` }), ` (${right + wrong ? Math.round((100 * right) / (right + wrong)) : 0}% correct)`),
      h("div", {}, "Review boxes (1 shaky … 5 mastered): ", h("b", { class: "num", text: boxes.join(" · ") })),
      weak.length ? h("div", {}, "Weakest lessons: ", h("b", { text: weak.map(([id, a]) => `${id} (${Math.round(a * 100)}%)`).join(", ") })) : null,
      fs().finals.length ? h("div", {}, "Finals: ", h("b", { text: fs().finals.map((e) => `${f2(e.grade, 0)}/30`).join(", ") })) : null,
      h("div", { class: "muted", text: Store.mode === "cloud" ? "Saved to your account; it syncs between laptop and phone." : "Saved in this browser only. Open the published page to sync across devices." })),
    h("div", { class: "panel", style: "display:grid;gap:8px" }, h("h2", { text: "Bring progress from the terminal" }),
      h("p", { class: "muted", text: "Already used course/run.sh? Paste course/.progress.json to merge it in (passed lessons, review deck, finals)." }), ta,
      h("div", { class: "row" }, h("button", { class: "btn primary", text: "Merge", onclick: () => { try { const t = JSON.parse(ta.value); t.updated = 0; S.st = mergeStates(S.st, t); Store.save(); toast("Progress merged."); route(); } catch { toast("That isn't valid JSON — paste the whole file."); } } }),
        h("button", { class: "btn", text: "Copy my progress", onclick: () => { const txt = JSON.stringify(S.st); navigator.clipboard.writeText(txt).then(() => toast("Copied."), () => { ta.value = txt; ta.select(); toast("Selected — copy it with Ctrl+C."); }); } })))));
}

/* ---------- router ---------- */
function route() {
  const r = location.hash.slice(1) || "home";
  setNav(r.startsWith("lesson-") || r.startsWith("unit-") ? "fundamentals" : r.startsWith("glesson-") || ["quiz", "exam", "map"].includes(r) ? "course" : r);
  if (r.startsWith("lesson-")) return viewLesson(unhid(r.slice(7)));
  if (r.startsWith("unit-")) return viewUnit(r.slice(5));
  if (r.startsWith("glesson-")) return viewGLesson(unhid(r.slice(8)));
  ({ home: viewHome, fundamentals: viewFundamentals, practice: viewPractice, review: viewReview, final: viewFinal, course: viewCourse, quiz: viewQuiz, exam: viewExam, glossary: viewGlossary, map: viewMap, progress: viewProgress }[r] || viewHome)();
}
window.addEventListener("hashchange", route);

(async function start() {
  try {
    const res = await fetch("data.json"); S.D = await res.json();
  } catch (e) { $("#app").replaceChildren(h("div", { class: "panel", text: "Couldn't load the course data (data.json). If you opened the file directly, run `course/run.sh web` instead." })); return; }
  indexData();
  S.st = Store.readLocal() || blankState(); Store.label(); route();
  await Store.init(); if (!S.session) route();
})();
</script>
